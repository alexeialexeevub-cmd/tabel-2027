<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табель ИТС 2027</title>
<style>
  :root { --primary: #2980b9; --bg: #f4f6f8; --border: #dcdde1; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #2f3640; }
  h1 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #718093; margin-bottom: 20px; font-size: 0.95rem; }
  .months-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; max-width: 1200px; margin: 0 auto 20px; }
  .month-btn { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #718093; transition: all 0.2s; font-size: 0.9rem; }
  .month-btn:hover { background: #e1e8ed; }
  .month-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 5px rgba(41, 128, 185, 0.4); }
  .table-container { max-width: 100%; overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; font-size: 0.9rem; white-space: nowrap; }
  th { background: #f8f9fa; font-weight: 600; color: #2f3640; position: sticky; top: 0; z-index: 10; }
  
  th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 11; background: #fff; min-width: 40px; }
  th:nth-child(2), td:nth-child(2) { position: sticky; left: 40px; z-index: 11; background: #fff; text-align: left; min-width: 200px; }
  th:nth-child(3), td:nth-child(3) { position: sticky; left: 240px; z-index: 11; background: #fff; text-align: left; min-width: 160px; }
  th:nth-child(4), td:nth-child(4) { position: sticky; left: 400px; z-index: 11; background: #fff; min-width: 60px; }
  th:nth-child(5), td:nth-child(5) { position: sticky; left: 460px; z-index: 11; background: #fff; min-width: 60px; border-right: 2px solid var(--primary); }
  th:nth-child(1), th:nth-child(2), th:nth-child(3), th:nth-child(4), th:nth-child(5) { z-index: 12; background: #eaf0f6; }
  tr:hover td { background: #f1f8ff; }
  tr:hover td:nth-child(-n+5) { background: #e1f0fa; }
  
  .val-V { color: #c0392b; font-weight: bold; background: #fadbd8; }
  .val-OT { color: #8e44ad; font-weight: bold; background: #f4ecf7; }
  .val-BL { color: #d35400; font-weight: bold; background: #fdebd0; }
  .val-empty { color: #bdc3c7; }
  .footer { text-align: center; margin-top: 20px; color: #718093; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>📋 Табель ИТС — 2027</h1>
  <div class="subtitle">ООО "Уральские Бани"</div>
  <div class="months-nav" id="monthsNav"></div>
  <div class="table-container">
    <table id="scheduleTable">
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer">Данные обновлены автоматически из Excel</div>
<script>
// СЮДА МЫ ВСТАВИМ ДАННЫЕ НА СЛЕДУЮЩЕМ ШАГЕ
console.log("Каркас загружен");
</script>
</body>
</html>
