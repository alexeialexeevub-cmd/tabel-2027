<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табель ИТС 2027</title>
<style>
  :root { --primary: #2980b9; --bg: #f4f6f8; --border: #dcdde1; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #2f3640; }
  h1 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #718093; margin-bottom: 20px; font-size: 0.95rem; }
  
  .months-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; max-width: 1200px; margin: 0 auto 20px; }
  .month-btn { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #718093; transition: all 0.2s; font-size: 0.9rem; }
  .month-btn:hover { background: #e1e8ed; }
  .month-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 5px rgba(41, 128, 185, 0.4); }

  /* Единый контейнер */
  .table-wrapper { 
    display: flex; 
    align-items: flex-start; 
    background: #fff; 
    border-radius: 8px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    width: 100%;
    overflow: hidden; 
  }

  /* Левая часть */
  .table-left { 
    flex-shrink: 0; 
    background: #fff; 
    border-right: 2px solid var(--primary); 
    z-index: 2;
    width: 520px; /* Жестко фиксируем ширину! */
  }
  
  /* Правая часть */
  .table-right { 
    overflow-x: auto; 
    flex-grow: 1; 
  }

  table { border-collapse: collapse; width: 100%; }
  
  th, td { 
    padding: 10px 12px; 
    border-bottom: 1px solid var(--border); 
    text-align: center; 
    font-size: 0.9rem; 
    white-space: nowrap; 
    height: 40px; 
    box-sizing: border-box;
  }
  
  th { background: #eaf0f6; font-weight: 600; color: #2f3640; }
  
  /* Левая таблица ширины */
  .table-left th:nth-child(1), .table-left td:nth-child(1) { width: 40px; min-width: 40px; }
  .table-left th:nth-child(2), .table-left td:nth-child(2) { width: 200px; min-width: 200px; text-align: left; }
  .table-left th:nth-child(3), .table-left td:nth-child(3) { width: 160px; min-width: 160px; text-align: left; }
  .table-left th:nth-child(4), .table-left td:nth-child(4) { width: 60px; min-width: 60px; }
  .table-left th:nth-child(5), .table-left td:nth-child(5) { width: 60px; min-width: 60px; }

  /* Правая таблица ширины */
  .table-right th, .table-right td { width: 45px; min-width: 45px; }

  /* Подсветка */
  tr:hover td { background: #f1f8ff; }
  
  .val-V { color: #c0392b; font-weight: bold; background: #fadbd8; }
  .val-OT { color: #8e44ad; font-weight: bold; background: #f4ecf7; }
  .val-BL { color: #d35400; font-weight: bold; background: #fdebd0; }
  .val-empty { color: #bdc3c7; }
  .footer { text-align: center; margin-top: 20px; color: #718093; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>📋 Табель ИТС — 2027</h1>
  <div class="subtitle">ООО "Уральские Бани"</div>
  <div class="months-nav" id="monthsNav"></div>
  
  <div class="table-wrapper">
    <div class="table-left">
      <table id="tableLeft">
        <thead><tr id="headLeft"></tr></thead>
        <tbody id="bodyLeft"></tbody>
      </table>
    </div>
    <div class="table-right" id="tableRightContainer">
      <table id="tableRight">
        <thead><tr id="headRight"></tr></thead>
        <tbody id="bodyRight"></tbody>
      </table>
    </div>
  </div>
  
  <div class="footer">Данные обновлены автоматически из Excel</div>

<script>
const monthsConfig = [
  { name: "Ноябрь", start: 5, days: 30 }, { name: "Декабрь", start: 35, days: 31 },
  { name: "Январь", start: 66, days: 31 }, { name: "Февраль", start: 97, days: 28 },
  { name: "Март", start: 125, days: 31 }, { name: "Апрель", start: 156, days: 30 },
  { name: "Май", start: 186, days: 31 }, { name: "Июнь", start: 217, days: 30 },
  { name: "Июль", start: 247, days: 31 }, { name: "Август", start: 278, days: 31 },
  { name: "Сентябрь", start: 309, days: 30 }, { name: "Октябрь", start: 339, days: 31 },
  { name: "Ноябрь", start: 370, days: 30 }, { name: "Декабрь", start: 400, days: 31 }
];

let currentMonthIndex = 0;
let parsedData = [];

function renderTable() {
  const month = monthsConfig[currentMonthIndex];
  
  const headLeft = document.getElementById("headLeft");
  const bodyLeft = document.getElementById("bodyLeft");
  const headRight = document.getElementById("headRight");
  const bodyRight = document.getElementById("bodyRight");
  
  headLeft.innerHTML = ""; bodyLeft.innerHTML = "";
  headRight.innerHTML = ""; bodyRight.innerHTML = "";

  let trHeadLeft = document.createElement("tr");
  ["№", "ФИО", "Должность", "Часы план", "Часы факт"].forEach(text => {
    let th = document.createElement("th"); th.textContent = text; trHeadLeft.appendChild(th);
  });
  headLeft.appendChild(trHeadLeft);

  let trHeadRight = document.createElement("tr");
  for (let i = 1; i <= month.days; i++) {
    let th = document.createElement("th"); th.textContent = i; trHeadRight.appendChild(th);
  }
  headRight.appendChild(trHeadRight);

  parsedData.forEach(row => {
    let trLeft = document.createElement("tr");
    for (let i = 0; i < 5; i++) {
      let td = document.createElement("td"); 
      td.textContent = row[i] || ""; 
      trLeft.appendChild(td);
    }
    bodyLeft.appendChild(trLeft);

    let trRight = document.createElement("tr");
    for (let i = 0; i < month.days; i++) {
      let td = document.createElement("td");
      let val = row[month.start + i] || "";
      if (val === "В") { td.className = "val-V"; td.textContent = "В"; }
      else if (val === "от" || val === "ОТ") { td.className = "val-OT"; td.textContent = val; }
      else if (val === "б/л") { td.className = "val-BL"; td.textContent = "б/л"; }
      else if (val === "") { td.className = "val-empty"; td.textContent = "—"; }
      else { td.textContent = val; }
      trRight.appendChild(td);
    }
    bodyRight.appendChild(trRight);
  });
}

function createNav() {
  const nav = document.getElementById("monthsNav");
  monthsConfig.forEach((m, idx) => {
    let btn = document.createElement("button");
    btn.className = "month-btn" + (idx === currentMonthIndex ? " active" : "");
    btn.textContent = m.name;
    btn.onclick = () => {
      currentMonthIndex = idx;
      document.querySelectorAll(".month-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTable();
      document.getElementById("tableRightContainer").scrollLeft = 0;
    };
    nav.appendChild(btn);
  });
}

window.onload = function() {
  if (typeof rawDataString !== 'undefined') {
    parsedData = rawDataString.split("\n").filter(line => line.trim() !== "").map(line => line.split("|"));
    createNav();
    renderTable();
  }
};
</script>
<script src="data.js"></script>
</body>
</html>
